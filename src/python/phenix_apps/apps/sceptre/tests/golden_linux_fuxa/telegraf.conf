# Rendered by scada/gen_configs.py -> /etc/telegraf/telegraf.conf on the historian.
# Variables: opc_endpoint, nodes [{rtu, device, field, ns, id}], influx_url, influx_token, influx_org, influx_bucket
[agent]
  interval = "5s"
  round_interval = true
  flush_interval = "10s"
  omit_hostname = false

[[inputs.opcua]]
  name = "waterway"
  endpoint = "opc.tcp://10.1.2.50:4840"
  connect_timeout = "10s"
  request_timeout = "5s"
  security_policy = "None"
  security_mode = "None"
  auth_method = "Anonymous"

  [[inputs.opcua.nodes]]
    name = "boat.direction"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.boat.direction"
    default_tags = { rtu = "rtu-1", device = "boat", field = "direction" }

  [[inputs.opcua.nodes]]
    name = "boat.location"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.boat.location"
    default_tags = { rtu = "rtu-1", device = "boat", field = "location" }

  [[inputs.opcua.nodes]]
    name = "lock.height"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.lock.height"
    default_tags = { rtu = "rtu-1", device = "lock", field = "height" }

  [[inputs.opcua.nodes]]
    name = "locksensor.active"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.locksensor.active"
    default_tags = { rtu = "rtu-1", device = "locksensor", field = "active" }

  [[inputs.opcua.nodes]]
    name = "locksensor.direction"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.locksensor.direction"
    default_tags = { rtu = "rtu-1", device = "locksensor", field = "direction" }

  [[inputs.opcua.nodes]]
    name = "lowergate.open"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.lowergate.open"
    default_tags = { rtu = "rtu-1", device = "lowergate", field = "open" }

  [[inputs.opcua.nodes]]
    name = "lowersensor.active"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.lowersensor.active"
    default_tags = { rtu = "rtu-1", device = "lowersensor", field = "active" }

  [[inputs.opcua.nodes]]
    name = "lowersensor.direction"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.lowersensor.direction"
    default_tags = { rtu = "rtu-1", device = "lowersensor", field = "direction" }

  [[inputs.opcua.nodes]]
    name = "lowervalve.open"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.lowervalve.open"
    default_tags = { rtu = "rtu-1", device = "lowervalve", field = "open" }

  [[inputs.opcua.nodes]]
    name = "lowerwater.height"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-1.lowerwater.height"
    default_tags = { rtu = "rtu-1", device = "lowerwater", field = "height" }

  [[inputs.opcua.nodes]]
    name = "lock.height"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.lock.height"
    default_tags = { rtu = "rtu-2", device = "lock", field = "height" }

  [[inputs.opcua.nodes]]
    name = "locksensor.active"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.locksensor.active"
    default_tags = { rtu = "rtu-2", device = "locksensor", field = "active" }

  [[inputs.opcua.nodes]]
    name = "locksensor.direction"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.locksensor.direction"
    default_tags = { rtu = "rtu-2", device = "locksensor", field = "direction" }

  [[inputs.opcua.nodes]]
    name = "uppergate.open"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.uppergate.open"
    default_tags = { rtu = "rtu-2", device = "uppergate", field = "open" }

  [[inputs.opcua.nodes]]
    name = "uppersensor.active"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.uppersensor.active"
    default_tags = { rtu = "rtu-2", device = "uppersensor", field = "active" }

  [[inputs.opcua.nodes]]
    name = "uppersensor.direction"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.uppersensor.direction"
    default_tags = { rtu = "rtu-2", device = "uppersensor", field = "direction" }

  [[inputs.opcua.nodes]]
    name = "uppervalve.open"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.uppervalve.open"
    default_tags = { rtu = "rtu-2", device = "uppervalve", field = "open" }

  [[inputs.opcua.nodes]]
    name = "upperwater.height"
    namespace = "2"
    identifier_type = "s"
    identifier = "rtu-2.upperwater.height"
    default_tags = { rtu = "rtu-2", device = "upperwater", field = "height" }


[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "waterway-historian-token"
  organization = "sceptre"
  bucket = "waterway"
