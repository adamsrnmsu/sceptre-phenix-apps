      advanced:
        machine: virt
        vga: virtio
        qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd -device virtio-gpu-pci -device usb-kbd,bus=xhci.0
      overrides:
        bus=usb-bus.0: bus=xhci.0
      network:
        interfaces:
        - name: IF0
          address: 10.1.2.72
          mask: 24
          proto: static
          type: ethernet
          vlan: SCADA
          gateway: 10.1.2.1
        - name: mgmt
          address: 172.16.2.72
          mask: 16
          proto: static
          type: ethernet
          vlan: MGMT
      type: VirtualMachine
    - general:
        hostname: rtu-1
