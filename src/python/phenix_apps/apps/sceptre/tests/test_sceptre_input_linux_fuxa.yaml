# Input for test_linux_fuxa_golden.py: the waterway-arm64 range scenario
# (phenix-waterway-range topologies/waterway-arm64, gen_scenario.py --linux-fuxa)
# with every SCADA-side host on `stack: linux_fuxa`. The topology's own
# injections are dropped so only the app's injects remain.
metadata:
  annotations:
    topology: waterway
    scenario: waterway
spec:
  experimentName: waterway-linux-fuxa
  baseDir: /tmp/sceptre-linux-fuxa
  scenario:
    apps:
    - name: sceptre
      assetDir: /phenix/topologies/waterway-arm64
      hosts:
      - hostname: historian
        metadata:
          type: historian
          stack: linux_fuxa
          influx_bucket: waterway
          influx_token: waterway-historian-token
          influx_password: waterway-admin-pass
          measurement: waterway
      - hostname: hmi
        metadata:
          type: hmi
          stack: linux_fuxa
      - hostname: waterway-provider
        metadata:
          type: provider
          simulator: Simulink
          publish_endpoint: udp://*;239.0.0.1:40000
          publish_points: /phenix/topologies/waterway-arm64/injects/publishPoints.txt
          solver: /phenix/topologies/waterway-arm64/injects/simulinksolver
      - hostname: opc
        metadata:
          connected_rtus:
          - rtu-1
          - rtu-2
          type: opc
          stack: linux_fuxa
      - hostname: scada-server
        metadata:
          type: scada-server
          stack: linux_fuxa
          fuxa_name: waterway
      - hostname: rtu-1
        metadata:
          modbus:
          - name: lowerwater
            type: water
          - name: lock
            type: water
          - name: lowergate
            type: gate
          - name: lowervalve
            type: valve
          - name: lowersensor
            type: boat-sensor
          - name: locksensor
            type: boat-sensor
          - name: boat
            type: boat
          infrastructure: waterway
          logic: lowergate.open = 1*((lowersensor.direction == 1) && (lowersensor.active == 1) && (lock.height >= lowerwater.height - 0.1) && (lock.height <= lowerwater.height + 0.1)) + 0*((locksensor.direction == 1) && (locksensor.active == 1) && (lock.height >= lowerwater.height - 0.1) && (lock.height <= lowerwater.height + 0.1)) + 1*((locksensor.direction == -1) && (locksensor.active == 1) && (lock.height >= lowerwater.height - 0.1) && (lock.height <= lowerwater.height + 0.1)) + 0*((lowersensor.direction == -1) && (lowersensor.active == 1)); lowervalve.open = 1*((lowersensor.direction == 1) && (lowersensor.active == 1) && (lock.height > lowerwater.height)) + 0*((locksensor.direction == 1) && (locksensor.active == 1) && (lock.height >= lowerwater.height)) + 1*((locksensor.direction == -1) && (locksensor.active == 1) && (lock.height > lowerwater.height)) + 0*((lowersensor.direction == -1) && (lowersensor.active == 1))
          provider: waterway-provider
          type: fd-server
      - hostname: rtu-2
        metadata:
          modbus:
          - name: upperwater
            type: water
          - name: lock
            type: water
          - name: uppergate
            type: gate
          - name: uppervalve
            type: valve
          - name: uppersensor
            type: boat-sensor
          - name: locksensor
            type: boat-sensor
          infrastructure: waterway
          logic: uppergate.open = 1*((locksensor.direction == 1) && (locksensor.active == 1) && (lock.height >= upperwater.height - 0.1) && (lock.height <= upperwater.height + 0.1)) + 0*((uppersensor.direction == 1) && (uppersensor.active == 1)) + 1*((uppersensor.direction == -1) && (uppersensor.active == 1) && (lock.height >= upperwater.height - 0.1) && (lock.height <= upperwater.height + 0.1)) + 0*((locksensor.direction == -1) && (locksensor.active == 1) && (lock.height >= upperwater.height - 0.1) && (lock.height <= upperwater.height + 0.1)); uppervalve.open = 1*((locksensor.direction == 1) && (locksensor.active == 1) && (lock.height < upperwater.height)) + 0*((uppersensor.direction == 1) && (uppersensor.active == 1)) + 1*((uppersensor.direction == -1) && (uppersensor.active == 1) && (lock.height < upperwater.height)) + 0*((locksensor.direction == -1) && (locksensor.active == 1) && (lock.height >= upperwater.height - 0.1) && (lock.height <= upperwater.height + 0.1))
          provider: waterway-provider
          type: fd-server
      - hostname: engineer-workstation
        metadata:
          type: engineer-workstation
          stack: linux_fuxa
  topology:
    nodes:
    - general:
        hostname: waterway-provider
        description: SCEPTRE Simulink provider (Rust simulinksolver)
      hardware:
        cpu: host
        memory: 2048
        vcpus: 2
        os_type: linux
        drives:
        - image: bennu-arm64.qc2
          interface: virtio
          inject_partition: 2
      advanced:
        machine: virt
        vga: virtio
        qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
      overrides:
        bus=usb-bus.0: bus=xhci.0
      network:
        interfaces:
        - name: mgmt
          address: 172.16.1.2
          mask: 16
          proto: static
          type: ethernet
          vlan: MGMT
          gateway: 172.16.1.1
      type: VirtualMachine
    - general:
        hostname: opc
        description: OPC UA gateway
      hardware:
        cpu: host
        memory: 1024
        vcpus: 2
        os_type: linux
        drives:
        - image: opc-arm64.qc2
          interface: virtio
          inject_partition: 2
      advanced:
        machine: virt
        vga: virtio
        qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
      overrides:
        bus=usb-bus.0: bus=xhci.0
      network:
        interfaces:
        - name: IF0
          address: 10.1.2.50
          mask: 24
          proto: static
          type: ethernet
          vlan: SCADA
          gateway: 10.1.2.1
        - name: mgmt
          address: 172.16.2.50
          mask: 16
          proto: static
          type: ethernet
          vlan: MGMT
      type: VirtualMachine
    - general:
        hostname: historian
        description: InfluxDB + telegraf
      hardware:
        cpu: host
        memory: 2048
        vcpus: 2
        os_type: linux
        drives:
        - image: historian-arm64.qc2
          interface: virtio
          inject_partition: 2
      advanced:
        machine: virt
        vga: virtio
        qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
      overrides:
        bus=usb-bus.0: bus=xhci.0
      network:
        interfaces:
        - name: IF0
          address: 10.1.2.60
          mask: 24
          proto: static
          type: ethernet
          vlan: SCADA
          gateway: 10.1.2.1
        - name: mgmt
          address: 172.16.2.60
          mask: 16
          proto: static
          type: ethernet
          vlan: MGMT
      type: VirtualMachine
    - general:
        hostname: hmi
        description: Firefox kiosk on FUXA
      hardware:
        cpu: host
        memory: 2048
        vcpus: 2
        os_type: linux
        drives:
        - image: hmi-arm64.qc2
          interface: virtio
          inject_partition: 2
      advanced:
        machine: virt
        vga: virtio
        qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd -device virtio-gpu-pci -device usb-kbd,bus=xhci.0
      overrides:
        bus=usb-bus.0: bus=xhci.0
      network:
        interfaces:
        - name: IF0
          address: 10.1.2.70
          mask: 24
          proto: static
          type: ethernet
          vlan: SCADA
          gateway: 10.1.2.1
        - name: mgmt
          address: 172.16.2.70
          mask: 16
          proto: static
          type: ethernet
          vlan: MGMT
      type: VirtualMachine
    - general:
        hostname: scada-server
        description: FUXA
      hardware:
        cpu: host
        memory: 2048
        vcpus: 2
        os_type: linux
        drives:
        - image: scada-arm64.qc2
          interface: virtio
          inject_partition: 2
      advanced:
        machine: virt
