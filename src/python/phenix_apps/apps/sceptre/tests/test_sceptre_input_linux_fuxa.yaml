        qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
      overrides:
        bus=usb-bus.0: bus=xhci.0
      network:
        interfaces:
        - name: IF0
          address: 10.1.2.71
          mask: 24
          proto: static
          type: ethernet
